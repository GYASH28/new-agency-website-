name: Review build quality
on:
  push:
  pull_request:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and static tests
        run: npm run check
      - name: Python compilation
        run: python3 -m py_compile scripts/preview.py
